[package]
name = "meme-wars"
version = "0.1.0"
edition = "2021"
description = "Meme Wars ($WAR): two factions fight a daily on-chain war; winners mint, losers burn."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
primitive-types = { version = "0.14.0", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
