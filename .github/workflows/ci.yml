name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo test
        working-directory: contracts/meme-wars
        run: cargo test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  simulation:
    name: Simulation reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the 60-day simulation
        run: python3 sim/simulate.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree
        run: ./scripts/check-secrets.sh
